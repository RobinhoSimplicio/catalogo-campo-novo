<!doctype html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Login | {{ loja.nome }}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #173f25,
                    #2f7044
                );
        }

        .login {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e9a62a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            text-align: center;
            color: #1f5d35;
            margin: 0;
        }

        .subtitulo {
            text-align: center;
            color: #697369;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5cc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #1f5d35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174729;
        }

        .erro {
            background: #ffe3e3;
            color: #a52d2d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f5d35;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login">

    <div class="logo">
        🌱
    </div>

    <h1>
        {{ loja.nome }}
    </h1>

    <p class="subtitulo">
        Área administrativa
    </p>


    {% with mensagens = get_flashed_messages() %}

        {% if mensagens %}

            {% for mensagem in mensagens %}

                <div class="erro">
                    {{ mensagem }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST" autocomplete="off">

    <label for="usuario">
        Usuário
    </label>

    <input
        type="text"
        id="usuario"
        name="usuario"
        autocomplete="off"
        required
        autofocus
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        name="senha"
        autocomplete="new-password"
        required
    >

    <button type="submit">
        Entrar no painel
    </button>

</form>


    <a
        class="voltar"
        href="{{ url_for('index') }}"
    >
        ← Voltar para o catálogo
    </a>

</div>

</body>

</html>
